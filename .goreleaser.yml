version: 2

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/infkf/vitrina/internal/version.Version={{ .Version }}
      - -X github.com/infkf/vitrina/internal/version.Commit={{ .Commit }}
      - -X github.com/infkf/vitrina/internal/version.BuildTime={{ .Date }}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch

brews:
  - name: vitrina
    repository:
      owner: infkf
      name: homebrew-vitrina
    homepage: "https://github.com/infkf/vitrina"
    description: "Lightweight PaaS-lite CLI toolbox for single-VPS app hosting"
    license: "MIT"
